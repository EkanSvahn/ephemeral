name: CI

# Branches are tested through their pull request. Pushes only trigger a run
# on main and on release tags, so a pull request no longer runs everything
# twice.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

# A newer push to the same pull request replaces the run that is in progress.
# Runs on main and on tags are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - name: Check formatting
        working-directory: backend
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Run gofmt on:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      - name: Vet backend
        working-directory: backend
        run: go vet ./...
      - name: Test backend
        working-directory: backend
        run: |
          go test ./...
      - name: Vulnerability scan (Go)
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  integration-tests:
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - name: Run integration tests (real Redis via testcontainers)
        working-directory: backend
        run: go test -tags=integration -timeout 5m ./...

  frontend-build:
    runs-on: ubuntu-latest
    env:
      VITE_APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # The UI shows the version from package.json in images built with
      # Docker, so a release tag has to match it.
      - name: Check that the tag matches package.json
        if: github.ref_type == 'tag'
        working-directory: frontend
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME does not match frontend/package.json ($expected)" >&2
            exit 1
          fi
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Test frontend
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Vulnerability scan (npm)
        working-directory: frontend
        run: |
          npm audit --audit-level=high

  container-scan:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - uses: actions/checkout@v7

      - name: Build backend image
        run: docker build -t ephemeral-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t ephemeral-frontend:ci ./frontend

      - name: Scan backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ephemeral-backend:ci
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ephemeral-frontend:ci
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
