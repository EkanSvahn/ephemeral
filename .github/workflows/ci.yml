name: CI

# Branches are tested through their pull request. Pushes only trigger a run
# on main and on release tags, so a pull request no longer runs everything
# twice.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

# A newer push to the same pull request replaces the run that is in progress.
# Runs on main and on tags are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - name: Check formatting
        working-directory: backend
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Run gofmt on:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      - name: Vet backend
        working-directory: backend
        run: go vet ./...
      - name: Test backend
        working-directory: backend
        run: |
          go test ./...
      - name: Vulnerability scan (Go)
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  integration-tests:
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - name: Run integration tests (real Redis via testcontainers)
        working-directory: backend
        run: go test -tags=integration -timeout 5m ./...

  frontend-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the oldest version CONTRIBUTING.md promises. 26 is what the
        # frontend image and the development stack are built with.
        node: ['22', '26']
    name: frontend-build (Node ${{ matrix.node }})
    env:
      VITE_APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # The UI shows the version from package.json in images built with
      # Docker, so a release tag has to match it.
      - name: Check that the tag matches package.json
        if: github.ref_type == 'tag'
        working-directory: frontend
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME does not match frontend/package.json ($expected)" >&2
            exit 1
          fi
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Test frontend
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Vulnerability scan (npm)
        working-directory: frontend
        run: |
          npm audit --audit-level=high

  # Follows the self-hosting steps in the README, so the templates cannot drift
  # away from the compose file without CI noticing.
  infra-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create configuration from the templates
        run: |
          cp infra/.env.example infra/.env
          cp infra/Caddyfile.prod.example infra/Caddyfile.prod
      - name: Validate compose files
        run: |
          docker compose -f infra/docker-compose.prod.yml config --quiet
          docker compose -f infra/docker-compose.dev.yml config --quiet
      - name: Validate proxy configuration
        run: |
          docker run --rm \
            -v "$PWD/infra/Caddyfile.prod:/etc/caddy/Caddyfile:ro" \
            caddy:2.11-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  container-scan:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - uses: actions/checkout@v7

      - name: Build backend image
        run: docker build -t ephemeral-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t ephemeral-frontend:ci ./frontend

      # nginx reads its configuration when the container starts, so a mistake
      # in nginx.conf would otherwise first show up on a deployed instance.
      - name: Smoke test frontend image
        run: |
          docker run -d --name web -p 8088:80 ephemeral-frontend:ci
          for attempt in $(seq 1 20); do
            curl -fsS -o /dev/null http://127.0.0.1:8088/ && break
            sleep 0.5
          done
          # A share link is served by the single-page app.
          curl -fsS -o /dev/null http://127.0.0.1:8088/s/smoke-test-id
          curl -fsSI http://127.0.0.1:8088/ | grep -i '^content-security-policy:'
          # The id in a share link must not end up in the container log.
          if docker logs web 2>&1 | grep -q 'smoke-test-id'; then
            echo "The web server logged a secret id" >&2
            exit 1
          fi
          docker rm -f web

      - name: Scan backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ephemeral-backend:ci
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ephemeral-frontend:ci
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
