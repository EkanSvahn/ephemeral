name: Bug report
description: Something does not work the way the documentation says it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Security problems do not belong in a public issue. Report them privately as described in [SECURITY.md](https://github.com/EkanSvahn/ephemeral/blob/main/SECURITY.md).

        Never paste a real secret, share link or password here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the stack with ...
        2. Create a secret with ...
        3. Open the link in ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The tag or commit you are running. The version badge in the bottom left corner of the UI shows it.
      placeholder: v0.2.0
    validations:
      required: true
  - type: dropdown
    id: setup
    attributes:
      label: How are you running it
      options:
        - infra/docker-compose.dev.yml
        - infra/docker-compose.prod.yml
        - Something else (describe it below)
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      description: Only needed when the problem shows up in the UI.
      placeholder: Firefox 145 on Ubuntu 24.04
  - type: textarea
    id: logs
    attributes:
      label: Logs and configuration
      description: Relevant API log lines and the settings you changed from the defaults. Remove domains and anything else you do not want public.
      render: text
